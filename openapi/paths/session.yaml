/:
  get:
    operationId: sessionList
    security:
      - sessionCookie: []
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
    responses:
      "200":
        description: List sessions
        content:
          application/json:
            schema:
              allOf:
                - $ref: "./components/schemas/Pagination.yaml"
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "./components/schemas/Session.yaml"
      "401":
        description: Unauthorized
      "404":
        description: Session not found
/{id}:
  get:
    operationId: getSession
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Get a session
        content:
          application/json:
            schema:
              $ref: "./components/schemas/Session.yaml"
      "404":
        description: Session not found
  delete:
    operationId: sessionDelete
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Delete a session account
      "401":
        description: Unauthorized
      "404":
        description: Session not found
