/:
  post:
    operationId: adminCreate
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./components/schemas/AdminCreate.yaml"
    responses:
      "201":
        description: Create an admin account. This can only be done by another admin with role "super"
      "401":
        description: Unauthorized
      "404":
        description: Admin not found
  get:
    operationId: adminList
    security:
      - sessionCookie: []
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
    responses:
      "200":
        description: List admin accounts
        content:
          application/json:
            schema:
              allOf:
                - $ref: "./components/schemas/Pagination.yaml"
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "./components/schemas/Admin.yaml"
      "401":
        description: Unauthorized
      "404":
        description: Admin not found
/{id}:
  get:
    operationId: adminRead
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Get an admin account
        content:
          application/json:
            schema:
              $ref: "./components/schemas/Admin.yaml"
      "401":
        description: Unauthorized
      "404":
        description: Admin not found
  put:
    operationId: adminUpdate
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./components/schemas/AdminUpdate.yaml"
    responses:
      "200":
        description: Update an admin account
      "401":
        description: Unauthorized
      "404":
        description: Admin not found
  delete:
    operationId: adminDelete
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Delete an admin account
      "401":
        description: Unauthorized
      "404":
        description: Admin not found
