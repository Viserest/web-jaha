/:
  post:
    operationId: bookingCreate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./components/schemas/BookingCreate.yaml"
    responses:
      "201":
        description: Create a booking
      "400":
        description: Invalid input
  get:
    operationId: bookingList
    security:
      - sessionCookie: []
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
    responses:
      "200":
        description: List bookings
        content:
          application/json:
            schema:
              allOf:
                - $ref: "./components/schemas/Pagination.yaml"
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "./components/schemas/Booking.yaml"
      "401":
        description: Unauthorized
      "404":
        description: Booking not found
/{id}:
  get:
    operationId: bookingRead
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Get a booking
        content:
          application/json:
            schema:
              $ref: "./components/schemas/Booking.yaml"
      "401":
        description: Unauthorized
      "404":
        description: Booking not found
  put:
    operationId: bookingUpdate
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./components/schemas/BookingUpdate.yaml"
    responses:
      "200":
        description: Update a booking
      "401":
        description: Unauthorized
      "404":
        description: Booking not found
  delete:
    operationId: bookingDelete
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Delete a booking
      "401":
        description: Unauthorized
      "404":
        description: Booking not found
