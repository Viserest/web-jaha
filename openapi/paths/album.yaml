/:
  post:
    operationId: albumCreate
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./components/schemas/AlbumCreate.yaml"
    responses:
      "201":
        description: Create an album
      "401":
        description: Unauthorized
      "400":
        description: Invalid input
  get:
    operationId: albumList
    security:
      - sessionCookie: []
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
    responses:
      "200":
        description: List albums
        content:
          application/json:
            schema:
              allOf:
                - $ref: "./components/schemas/Pagination.yaml"
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "./components/schemas/Album.yaml"
      "401":
        description: Unauthorized
      "404":
        description: Album not found
/{id}:
  get:
    operationId: albumRead
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Get an album
        content:
          application/json:
            schema:
              $ref: "./components/schemas/Album.yaml"
      "401":
        description: Unauthorized
      "404":
        description: Album not found
  put:
    operationId: albumUpdate
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./components/schemas/AlbumUpdate.yaml"
    responses:
      "200":
        description: Update an album
      "401":
        description: Unauthorized
      "404":
        description: Album not found
  delete:
    operationId: albumDelete
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Delete an ablum
      "401":
        description: Unauthorized
      "404":
        description: Album not found
