/:
  post:
    operationId: imageCreate
    security:
      - sessionCookie: []
    parameters:
      - name: album_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
    responses:
      "201":
        description: Image uploaded
      "401":
        description: Unauthorized
      "400":
        description: Invalid input
  get:
    operationId: imageList
    security:
      - sessionCookie: []
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
    responses:
      "200":
        description: List images
        content:
          application/json:
            schema:
              allOf:
                - $ref: "./components/schemas/Pagination.yaml"
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "./components/schemas/Image.yaml"
      "401":
        description: Unauthorized
      "404":
        description: Image not found
/{id}:
  get:
    operationId: imageRead
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Get an image
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      "404":
        description: Image not found
  delete:
    operationId: imageDelete
    security:
      - sessionCookie: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Delete an image
      "401":
        description: Unauthorized
      "404":
        description: Image not found
